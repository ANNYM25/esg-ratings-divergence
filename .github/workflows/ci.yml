name: ci

# The pipeline the README describes: typecheck, lint, tests with coverage, the
# dataset calibration check, the production build, and the Python research engine
# with its cross-language parity tests — on every push and PR.
# The calibrate step fails the build if a hand-edit drifts the seed data's
# correlation structure outside the published range.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests with coverage
        run: npm run coverage

      - name: Data calibration check
        run: npm run calibrate

      - name: Exported data is up to date
        run: npm run export:data && git diff --exit-code data/

      - name: Production build
        run: npm run build

  python:
    name: python · tests + parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (incl. TypeScript parity)
        run: pytest -q

      - name: Headline report
        run: python -m esg_divergence
